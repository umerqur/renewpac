  <body>
    <div id="root"></div>

    <!--
      Netlify form detection.
      Netlify parses static HTML at build time to find forms with the
      `netlify` attribute. These hidden forms register the fields used by the
      React components so that submissions from the client (posted via fetch)
      are accepted and stored in the Netlify dashboard.
    -->
    <form name="book-appointment" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
